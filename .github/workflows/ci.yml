name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - name: smoke test over the wire
        run: |
          ./build/kvserver --port 5600 --mode event --aof ci.aof & sleep 0.5
          printf 'SET a 1\nINCR a\nGET a\nPEXPIRE a 100\nTTL a\nINFO\nQUIT\n' | nc -w 2 127.0.0.1 5600
          ./build/kvbench --port 5600 --clients 10 --requests 20000 --pipeline 8
          kill -INT %1; wait %1
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        san: [thread, address]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKV_SANITIZE=${{ matrix.san }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
