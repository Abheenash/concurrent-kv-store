name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - name: smoke test over the wire
        run: |
          ./build/kvserver --port 5600 --mode event --aof ci.aof & sleep 0.5
          printf 'SET a 1\nINCR a\nGET a\nPEXPIRE a 100\nTTL a\nINFO\nQUIT\n' | nc -w 2 127.0.0.1 5600
          ./build/kvbench --port 5600 --clients 10 --requests 20000 --pipeline 8
          kill -INT %1; wait %1
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        san: [thread, address]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DKV_SANITIZE=${{ matrix.san }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1

  # Warnings-as-errors, CI only. Kept out of CMakeLists so a contributor on a
  # newer compiler that emits a new warning can still build locally, while the
  # gate stays strict.
  strict-warnings:
    name: -Werror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Werror"
      - run: cmake --build build -j

  # clang-tidy finds what the compiler does not: use-after-move, lifetime bugs,
  # missing locks, and the concurrency checks that matter most in this repo.
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: configure (export compile_commands.json)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: analyse
        run: |
          FILES=$(git ls-files '*.cpp' '*.hpp' '*.h' | grep -v '^build/' || true)
          [ -z "$FILES" ] && { echo "no sources"; exit 0; }
          clang-tidy -p build $FILES

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: analyse
        run: |
          cppcheck --enable=warning,performance,portability \
            --inline-suppr --std=c++17 --error-exitcode=1 \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --suppress=passedByValueCallback \
            -I include src tests

  # GitHub's own semantic analysis. Free on public repos, and it is the one that
  # reads across translation units rather than file by file.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          queries: security-and-quality
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build -j
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  # The Dockerfile shipped in this repo was never built by CI and never scanned.
  # A container recipe nobody builds rots quietly: a base image goes stale, a
  # build step breaks against a newer compiler, and nothing says so until someone
  # tries to run it. The non-root assertion is here for the same reason the other
  # repos have one — it was the check that caught this image running as root.
  image:
    name: image (build + non-root + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t concurrent-kv-store:ci .

      # A parsing bug in a network server running as root is a host compromise;
      # the same bug under uid 10001 is a crash.
      - name: the server does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id concurrent-kv-store:ci -u)
          echo "runtime uid: $uid"
          [ "$uid" = "10001" ] || { echo "::error::expected uid 10001, got $uid"; exit 1; }

      # The append-only file is written at runtime, so the unprivileged user has
      # to own /data. Asserted because a chown that silently stops working turns
      # into a crash on first write, in production, not here.
      - name: the unprivileged user can write its append-only file
        run: |
          docker run --rm --entrypoint sh concurrent-kv-store:ci \
            -c 'touch /data/ci-probe' || { echo "::error::/data is not writable by uid 10001"; exit 1; }

      - name: trivy
        run: |
          TRIVY_VERSION=v0.74.0
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 concurrent-kv-store:ci
